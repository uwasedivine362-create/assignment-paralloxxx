<!DOCTYPE html>
<html>
<head>
<title>Parallax Website</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-nav">
  <div class="nav-container">
    
    <!-- Left Links -->
    <div class="nav-left">
      <a href="#home"> <i class="fa fa-home" ></i>HOME</a>
      <a href="#about"> <i class="fa fa-user" ></i>ABOUT</a>
      <a href="#portfolio"> <i class="fa fa-th" ></i>PORTFOLIO</a>
      <a href="#contact"> <i class="fa fa-envelope" ></i>CONTACT</a>
      <a href="#search" class="search-button"><i class="fa fa-search icon" ></i></a>
      </div>

    <!-- Right Icon -->
    <div class="nav-right">
      
      
    </div>

    <!-- Mobile Menu Icon -->
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="mobile-menu">
    <a href="#home"><i class="fa fa-home"></i>HOME</a>
    <a href="#about"><i class="fa fa-home"></i>ABOUT</a>
    <a href="#portfolio"><i class="fa fa-home"></i>PORTFOLIO</a>
    <a href="#contact"><i class="fa fa-phone"></i>CONTACT</a>
  </div>
</header>

<!-- Parallax Section 1 -->
<section id="home" class="parallax bg1">
  <div class="center-text">
    <h1>PARALLAX WEBSITE</h1>
  </div>
</section>



<!-- Footer -->
<footer class="footer-container">
  <a href="#home" class="to-top-btn"><i class="fa fa-arrow-up"></i> To the top</a>

  <div class="social-icons">
    <i class="fa fa-facebook-official"></i>
    <i class="fa fa-instagram"></i>
    <i class="fa fa-snapchat"></i>
    <i class="fa fa-pinterest-p"></i>
    <i class="fa fa-twitter"></i>
    <i class="fa fa-linkedin"></i>
  </div>

  <ul><li><p>Powered by <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a></p></li></ul>
</footer>

</body>
</html>
